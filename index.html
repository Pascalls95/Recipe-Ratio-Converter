<!DOCTYPE html>
<html>
    <head>
        <title>Recipe Ratio Converter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Recipe Ratio Converter</h1>
        
        <!--stuff for serving inputs (original and desired)-->
        <label>Original Serves:</label>
        <input id="original" type="number">
        <label>Desired Serves:</label>
        <input id="desired" type="number">

        <!--textarea input for recipe (users copy paste recipe list straight here)-->
        <h2>Paste Your Recipe Here</h2>
        <textarea id="recipeInput" rows="8" cols="40" placeholder="e.g.
        300g flour
        150g sugar
        3 eggs
        50mL milk"></textarea>

        <button id="examineRecipe">Load Ingredients</button>

        <!--manual input (users insert each ingredient separately)-->
        <h2>Insert Your Recipe Manually</h2>
        <div id-="ingredients"></div>
        <button id="addIngredient">Add Ingredient</button>

        <!--convert the ratios-->
        <button id="convert">Convert</button>
        <h2>Converted Ingredients</h2>
        <div id="convertedIngredients"></div>

        <!--link to javascript-->
        <script src="script.js"></script>
    </body>
</html>
